name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'        # keep in sync with your pom.xml and the Dockerfile
          cache: maven

      - name: Build and run all tests
        run: mvn -B verify

      - name: Keep the test reports when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t redis-lite:ci .

      - name: Smoke test the image (start, use, SIGTERM, restart on the same volume)
        run: bash scripts/smoke-test.sh redis-lite:ci